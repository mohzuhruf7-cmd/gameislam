<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Edukasi Islam & Matematika</title>
  <style>
    :root {
      --primary: #2E7D32;
      --primary-dark: #1B5E20;
      --accent: #FFC107;
      --bg: #F4F6F8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .user-card {
      background: #E8F5E9;
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--primary-dark);
      font-weight: bold;
    }

    .user-card button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .question-box {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin: 20px 0;
      background: #F9F9F9;
      padding: 20px;
      border-radius: 12px;
      border: 2px dashed #DDD;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-option {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-option:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .score-board {
      font-size: 18px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
    }

    /* Modal Overlay Login */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #CCC;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
    }

    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      color: #2E7D32;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- MODAL LOGIN -->
  <div id="modal-login" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin-top:0; color:var(--primary);">Selamat Datang! 👋</h2>
      <p style="color:#666; font-size:14px;">Masukkan data diri sebelum bermain agar skor Anda tercatat di Google Drive.</p>
      
      <div class="form-group">
        <label>Nama Lengkap:</label>
        <input type="text" id="input-nama" placeholder="Contoh: Ahmad Subagja">
      </div>
      
      <div class="form-group">
        <label>Kelas / Sekolah:</label>
        <input type="text" id="input-kelas" placeholder="Contoh: 4B - SDN 01">
      </div>
      
      <button class="btn-submit" onclick="simpanProfilPemain()">Mulai Bermain 🚀</button>
    </div>
  </div>

  <!-- CONTAINER GAME -->
  <div class="container">
    <div class="user-card">
      <span id="display-user">Pemain: -</span>
      <button onclick="gantiPemain()">Ganti Akun</button>
    </div>

    <div class="score-board">
      Skor Saat Ini: <span id="score-text" style="color:var(--primary);">0</span>
    </div>

    <div id="game-area">
      <div class="question-box" id="question-text">Soal akan muncul di sini</div>
      
      <div class="options-grid" id="options-container">
        <!-- Pilihan jawaban di-generate lewat JS -->
      </div>
    </div>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    // =============================================================
    // 1. KONFIGURASI APPS SCRIPT
    // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
    // =============================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgl0aTGshWzEKiCYjSpHZwamk-T9XWMwmKbNqDfQfHKfaAZQV2bbN76zJHPb-7XackOw/exec";

    // Variables Game
    let playerInfo = { nama: "", kelas: "" };
    let currentScore = 0;
    let currentQuestion = {};
    let totalSoalDijawab = 0;
    const MAX_SOAL = 5; // Game selesai & kirim skor setiap 5 soal

    // Bank Soal Contoh (Bisa disesuaikan/ditambah)
    const bankSoal = [
      { q: "Berapakah hasil dari 12 + 15?", options: [27, 25, 29, 30], correct: 27 },
      { q: "Rukun Islam yang pertama adalah...", options: ["Syahadat", "Shalat", "Zakat", "Puasa"], correct: "Syahadat" },
      { q: "Berapakah hasil dari 8 x 7?", options: [54, 56, 48, 64], correct: 56 },
      { q: "Malaikat yang bertugas menyampaikan wahyu adalah...", options: ["Mikail", "Jibril", "Israfil", "Izrail"], correct: "Jibril" },
      { q: "Berapakah hasil dari 50 - 18?", options: [32, 34, 28, 30], correct: 32 },
      { q: "Kitab suci yang diturunkan kepada Nabi Muhammad SAW adalah...", options: ["Taurat", "Zabur", "Injil", "Al-Qur'an"], correct: "Al-Qur'an" }
    ];

    // Initialize Game & Cek Login
    window.addEventListener("DOMContentLoaded", () => {
      const savedNama = localStorage.getItem("game_player_nama");
      const savedKelas = localStorage.getItem("game_player_kelas");

      if (savedNama && savedKelas) {
        playerInfo.nama = savedNama;
        playerInfo.kelas = savedKelas;
        document.getElementById("modal-login").style.display = "none";
        updateUserDisplay();
        loadNextQuestion();
      }
    });

    // Simpan Profil Pemain dari Modal
    function simpanProfilPemain() {
      const nama = document.getElementById("input-nama").value.trim();
      const kelas = document.getElementById("input-kelas").value.trim();

      if (!nama || !kelas) {
        alert("Harap isi Nama dan Kelas terlebih dahulu!");
        return;
      }

      playerInfo.nama = nama;
      playerInfo.kelas = kelas;

      localStorage.setItem("game_player_nama", nama);
      localStorage.setItem("game_player_kelas", kelas);

      document.getElementById("modal-login").style.display = "none";
      updateUserDisplay();
      loadNextQuestion();
    }

    // Update Tampilan Nama di Header
    function updateUserDisplay() {
      document.getElementById("display-user").innerText = `👤 ${playerInfo.nama} (${playerInfo.kelas})`;
    }

    // Ganti Akun / Logout
    function gantiPemain() {
      localStorage.removeItem("game_player_nama");
      localStorage.removeItem("game_player_kelas");
      location.reload();
    }

    // Tampilkan Soal Berikutnya
    function loadNextQuestion() {
      if (totalSoalDijawab >= MAX_SOAL) {
        selesaiGame();
        return;
      }

      const randomIndex = Math.floor(Math.random() * bankSoal.length);
      currentQuestion = bankSoal[randomIndex];

      document.getElementById("question-text").innerText = currentQuestion.q;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      currentQuestion.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsContainer.appendChild(btn);
      });
    }

    // Cek Jawaban Pemain
    function checkAnswer(selectedOpt) {
      totalSoalDijawab++;
      if (selectedOpt === currentQuestion.correct) {
        currentScore += 20;
        document.getElementById("score-text").innerText = currentScore;
      }
      loadNextQuestion();
    }

    // Game Selesai & Kirim Data ke Apps Script / Google Drive
    function selesaiGame() {
      document.getElementById("game-area").innerHTML = `
        <h2>🎉 Game Selesai!</h2>
        <p>Skor Akhir Anda: <strong style="font-size:24px; color:var(--primary);">${currentScore}</strong></p>
        <button class="btn-submit" onclick="restartGame()">Main Lagi 🔄</button>
      `;

      kirimSkorKeGoogleDrive(currentScore);
    }

    // Restart Game
    function restartGame() {
      currentScore = 0;
      totalSoalDijawab = 0;
      document.getElementById("score-text").innerText = "0";
      document.getElementById("status-msg").innerText = "";
      document.getElementById("game-area").innerHTML = `
        <div class="question-box" id="question-text">Soal akan muncul di sini</div>
        <div class="options-grid" id="options-container"></div>
      `;
      loadNextQuestion();
    }

    // =============================================================
    // FUNGSI PENGIRIMAN DATA KE GOOGLE APPS SCRIPT
    // =============================================================
    function kirimSkorKeGoogleDrive(skorAkhir) {
      const statusDiv = document.getElementById("status-msg");
      statusDiv.innerText = "⏳ Mengirim skor ke Google Drive...";

      if (APPS_SCRIPT_URL.includes("PASTE_URL_WEB_APP_ANDA_DI_SINI")) {
        statusDiv.innerText = "⚠️ Harap masukkan URL Apps Script Anda di dalam kode HTML!";
        return;
      }

      const payload = {
        nama: playerInfo.nama,
        kelas: playerInfo.kelas,
        skor: skorAkhir,
        detail: `Menyelesaikan ${MAX_SOAL} Soal`
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = "✅ Skor berhasil tercatat di Google Sheets Anda!";
      })
      .catch((err) => {
        console.error("Error:", err);
        statusDiv.innerText = "❌ Gagal mengirim skor ke Google Drive.";
      });
    }
  </script>
</body>
</html>
